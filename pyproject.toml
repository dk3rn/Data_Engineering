
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wspr-data-pipeline"
version = "0.1.0"
description = "WSPR propagation telemetry ingestion and database pipeline"
authors = [{ name = "Prof. Dr. Peter Kern" }]
requires-python = ">=3.14"
dependencies = [
"requests>=2.31.0",
"pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
"pytest>=8.0.0",
"ruff>=0.4.0",
]